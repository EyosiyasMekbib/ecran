name: Keep CMS warm

# Pings the Strapi CMS (now on Render) so it never sits idle long enough to spin
# down. Render free web services sleep after ~15 min of no traffic; any request
# resets that timer. We target a DB-touching route (global), not /_health, so the
# ping wakes Node AND the Postgres query path. curl uses a long timeout so that
# even if the service had already slept, the ping wakes it (~50s) and still passes.
#
# NOTES:
#  - Scheduled workflows only run from the DEFAULT branch (main).
#  - GitHub's scheduler is best-effort and often late; each run pings a few times
#    to bridge the gap. Repo is public -> Actions are free.
#  - For tighter timing, a precise external pinger (cron-job.org) is more reliable
#    than GitHub's scheduler — see the notes the assistant gave.

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 min — extra margin under Render's 15-min idle
  workflow_dispatch:

concurrency:
  group: keep-cms-warm
  cancel-in-progress: true

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Warm Strapi (Node + Postgres)
        env:
          CMS_URL: 'https://ecran-cms.onrender.com/api/global?populate=*'
          PINGS: '4'          # pings per run
          GAP_SECONDS: '60'   # spacing between pings
        run: |
          ok=0
          for i in $(seq 1 "$PINGS"); do
            result=$(curl -sS -m 90 --retry 2 --retry-delay 10 --retry-all-errors \
                       -o /dev/null -w '%{http_code} %{time_total}s' "$CMS_URL" 2>&1) \
                     || result="network-error"
            code=${result%% *}
            echo "ping $i/$PINGS -> $result"
            if [ "$code" = "200" ]; then ok=$((ok + 1)); fi
            if [ "$i" -lt "$PINGS" ]; then sleep "$GAP_SECONDS"; fi
          done
          echo "warm pings succeeded: $ok/$PINGS"
          if [ "$ok" -eq 0 ]; then
            echo "::error::CMS returned no 200 to any warm ping — it may be down."
            exit 1
          fi
