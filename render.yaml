# Render Blueprint — free Strapi CMS.
# Deploy: https://dashboard.render.com → New → Blueprint → connect this repo.
# Render reads this file, provisions the service, and auto-generates the secrets.
# You only paste DATABASE_URL (from Neon). See DEPLOY-RENDER.md for the full flow.
services:
  - type: web
    name: ecran-cms
    runtime: docker
    plan: free
    region: frankfurt        # closest free region to Ethiopia; change if you prefer
    rootDir: backend
    dockerfilePath: Dockerfile.render
    healthCheckPath: /_health
    autoDeploy: true
    envVars:
      - key: DATABASE_CLIENT
        value: postgres
      - key: DATABASE_URL      # paste the Neon POOLED connection string in the dashboard
        sync: false
      - key: DATABASE_SSL
        value: "true"
      # Strapi secrets — Render generates strong random values automatically:
      - key: APP_KEYS
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: API_TOKEN_SALT
        generateValue: true
      - key: TRANSFER_TOKEN_SALT
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      # Contact-form notifications, sent through the existing cPanel mailbox.
      # Paste the mailbox password in the dashboard; without it the form still
      # saves submissions to the CMS, it just won't email anyone.
      # NOTE: some hosts block outbound SMTP. If the log shows connection
      # timeouts on send, that egress is blocked and this needs an HTTP-API
      # sender (e.g. Resend) instead.
      - key: SMTP_HOST
        value: mail.ecran-et.org
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USERNAME
        value: info@ecran-et.org
      - key: SMTP_PASSWORD
        sync: false
      - key: CONTACT_NOTIFY_EMAIL
        value: info@ecran-et.org
      - key: CONTACT_FROM_EMAIL
        value: info@ecran-et.org
