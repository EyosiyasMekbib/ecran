# Render Blueprint — free Strapi CMS.
# Deploy: https://dashboard.render.com → New → Blueprint → connect this repo.
# Render reads this file, provisions the service, and auto-generates the secrets.
# You only paste DATABASE_URL (from Neon). See DEPLOY-RENDER.md for the full flow.
services:
  - type: web
    name: ecran-cms
    runtime: docker
    plan: free
    region: frankfurt        # closest free region to Ethiopia; change if you prefer
    rootDir: backend
    dockerfilePath: Dockerfile.render
    healthCheckPath: /_health
    autoDeploy: true
    envVars:
      - key: DATABASE_CLIENT
        value: postgres
      - key: DATABASE_URL      # paste the Neon POOLED connection string in the dashboard
        sync: false
      - key: DATABASE_SSL
        value: "true"
      # Strapi secrets — Render generates strong random values automatically:
      - key: APP_KEYS
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: API_TOKEN_SALT
        generateValue: true
      - key: TRANSFER_TOKEN_SALT
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      # Contact-form notifications (Resend HTTP API — Render restricts outbound SMTP).
      # Paste the Resend API key in the dashboard; the form still saves submissions
      # to the CMS without it, it just won't email anyone.
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_NOTIFY_EMAIL
        value: info@ecran-et.org
      # Must be on a domain verified in Resend, otherwise sends are rejected.
      - key: CONTACT_FROM_EMAIL
        value: ECRAN Website <noreply@ecran-et.org>
